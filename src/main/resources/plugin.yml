name: CellTowers
version: '${version}'
main: dev.mccomm.cell.CellPlugin
api-version: '26.1'
description: Cell towers, carriers, bands, signal, SMS and calls.
author: MCcomm

permissions:
  celltowers.admin:
    description: Manage every carrier and tower, reload config.
    default: op
  celltowers.carrier.create:
    description: Create your own carrier.
    default: true
  celltowers.use:
    description: Use /cell, /text and /call.
    default: true
