# ============================================================
#  MCcomm configuration
#  Distances are in blocks, speeds in Mbps, ping in ms.
# ============================================================

prefix: "<dark_gray>[<aqua>Cell</aqua>]</dark_gray> "

# Emergency number. Works without a subscription when any tower reaches you.
# It does nothing yet beyond a message.
emergency-number: "909"

# Bands are ordered from lowest to highest. When you leave a band's range
# you fall back to the next lower band the tower has enabled.
#   range            max distance at which the band can be received
#   max-mbps         peak download with a Netherite backhaul and perfect signal
#   upload-ratio     upload = download * ratio
#   ping-ms          base latency
#   obstruction-db   signal lost per solid block in the walls right around you
#                    (only the first few blocks from you are checked; hills and
#                    terrain between you and the tower are ignored)
#   max-obstruction-db  cap on that loss, so being indoors never kills a band
#                    by itself (mmWave keeps a high cap: it still wants line of sight)
#   sms-delay-ticks  how long a /text takes to deliver on this band
#   min-generation   tower generation needed to enable this band
#   icon             GUI item
bands:
  2g:
    name: "2G"
    range: 3000
    max-mbps: 0.2
    upload-ratio: 0.5
    ping-ms: 320
    obstruction-db: 0.5
    max-obstruction-db: 6
    sms-delay-ticks: 80
    min-generation: 1
    icon: COAL
  3g:
    name: "3G"
    range: 2400
    max-mbps: 8
    upload-ratio: 0.4
    ping-ms: 120
    obstruction-db: 0.75
    max-obstruction-db: 8
    sms-delay-ticks: 40
    min-generation: 1
    icon: COPPER_INGOT
  4g:
    name: "4G"
    range: 1200
    max-mbps: 100
    upload-ratio: 0.3
    ping-ms: 45
    obstruction-db: 1.0
    max-obstruction-db: 10
    sms-delay-ticks: 20
    min-generation: 2
    icon: IRON_INGOT
  4g+:
    name: "4G+"
    range: 950
    max-mbps: 300
    upload-ratio: 0.3
    ping-ms: 32
    obstruction-db: 1.25
    max-obstruction-db: 10
    sms-delay-ticks: 15
    min-generation: 3
    icon: GOLD_INGOT
  5g-low:
    name: "5G Low"
    range: 1000
    max-mbps: 250
    upload-ratio: 0.35
    ping-ms: 25
    obstruction-db: 1.25
    max-obstruction-db: 10
    sms-delay-ticks: 10
    min-generation: 3
    icon: REDSTONE
  5g-mid:
    name: "5G Mid"
    range: 550
    max-mbps: 1000
    upload-ratio: 0.3
    ping-ms: 18
    obstruction-db: 2.0
    max-obstruction-db: 14
    sms-delay-ticks: 8
    min-generation: 4
    icon: LAPIS_LAZULI
  5g-high:
    name: "5G High"
    range: 275
    max-mbps: 2000
    upload-ratio: 0.25
    ping-ms: 12
    obstruction-db: 3.0
    max-obstruction-db: 18
    sms-delay-ticks: 6
    min-generation: 4
    icon: DIAMOND
  5g-mmwave:
    name: "5G mmWave"
    range: 90
    max-mbps: 4000
    upload-ratio: 0.2
    ping-ms: 6
    obstruction-db: 10.0
    max-obstruction-db: 45   # mmWave still mostly needs line of sight
    sms-delay-ticks: 4
    min-generation: 5
    icon: NETHERITE_INGOT

# Tower generations. A band needs at least its min-generation (see bands). Each
# generation's model name is used for the Generic manufacturer's towers.
generations:
  1:
    model: "CT-100 Classic"
  2:
    model: "CT-200 Edge"
  3:
    model: "CT-300 LTE-A"
  4:
    model: "CT-400 NR"
  5:
    model: "CT-500 NR-X"

# Backhaul block placed in the tower GUI. Once installed it is locked: it can
# only be discarded (destroyed), never taken back. Without one the tower is offline.
backhaul:
  NETHERITE_BLOCK: { name: "Netherite", multiplier: 1.00 }
  DIAMOND_BLOCK:   { name: "Diamond",   multiplier: 0.70 }
  GOLD_BLOCK:      { name: "Gold",      multiplier: 0.45 }
  IRON_BLOCK:      { name: "Iron",      multiplier: 0.25 }
  COPPER_BLOCK:    { name: "Copper",    multiplier: 0.10 }

signal:
  update-interval-ticks: 20
  best-dbm: -50          # signal right next to a tower
  cutoff-dbm: -115       # below this the band is lost
  falloff-exponent: 1.0  # >1 keeps signal strong longer, then drops fast
  # dBm thresholds for 4, 3 and 2 bars. Anything above cutoff is at least 1 bar.
  bars: [-75, -88, -101]
  # Only the walls right around the player count (being inside a building).
  # Terrain between you and the tower is ignored, Minecraft hills are not realistic.
  obstruction-scan-distance: 6
  max-obstruction-blocks: 6
  rain-db: 2
  thunder-db: 4
  # Caves: no loss for the first few blocks below the surface (houses, basements),
  # then a gentle loss per block, capped.
  underground-grace-blocks: 8
  underground-db-per-block: 0.4
  underground-max-db: 18
  # Antenna height above the sign, used for distance and line of sight.
  antenna-height: 1.5

congestion:
  # Users one band of a tower serves at full speed, by tower generation (Gen 1..5).
  # Beyond that the band's speed is divided between them, so newer towers hold up
  # better under load.
  capacity-per-generation: [4, 6, 9, 13, 18]
  users-before-slowdown: 4   # fallback if the list above is missing

speedtest:
  cooldown-seconds: 10
  jitter-percent: 10
  # Speed multiplier at the weakest usable signal (1.0 at best signal).
  min-signal-factor: 0.15

carriers:
  max-per-player: 1          # admins are exempt; -1 = unlimited
  max-towers-per-carrier: -1 # -1 = unlimited
  name-pattern: "^[A-Za-z0-9_&.\\-]{2,20}$"

towers:
  # Paid from the carrier's wallet when a tower is built (admins build free).
  creation-cost: 0     # extra fee on top of buying the tower model
  # Towers get a name at creation, like LF1 (Layford 1) or GH2 (Greene Hill 2).
  # Names are unique across the server, case-insensitive.
  name-pattern: "^[A-Za-z0-9_\\-]{1,12}$"
  # Taller towers reach further. Height is measured from the antenna (just above
  # the sign) down to the typical ground level around the tower, sampled in two
  # rings of points so the mast itself and single buildings don't count.
  height-bonus:
    enabled: true
    free-blocks: 4           # no bonus for the first few blocks (a sign on a wall)
    percent-per-block: 1.0   # +1% range per block above that
    max-percent: 50          # capped at +50% (reached at 54 blocks)
    sample-radius: 12        # ground is sampled at this radius and twice it

subscriptions:
  max-active: 2     # the most SIM slots any phone can have
  max-inactive: 4

# ------------------------------------------------------------------ economy
# Players and carriers deposit ores into a wallet; each ore is worth credits.
# Everything (phones, plans, upkeep) is priced in credits.
currency:
  name: "credits"
  symbol: "cr"
  ores:
    COPPER_INGOT: 1
    IRON_INGOT: 3
    GOLD_INGOT: 10
    REDSTONE: 1
    LAPIS_LAZULI: 2
    EMERALD: 30
    DIAMOND: 40
    NETHERITE_INGOT: 200
    COPPER_BLOCK: 9
    IRON_BLOCK: 27
    GOLD_BLOCK: 90
    REDSTONE_BLOCK: 9
    LAPIS_BLOCK: 18
    EMERALD_BLOCK: 270
    DIAMOND_BLOCK: 360
    NETHERITE_BLOCK: 1800

# Phones are bought in /cell eshop and stay on your account. You use one at a
# time; it limits the highest band you can connect on, and how many SIMs are active.
# Switching to a phone with fewer SIM slots moves the extra SIMs to inactive.
phones:
  connect:        { name: "Connect",    max-band: 3g,        sims: 1, price: 64,   icon: STONE_BUTTON }
  connect-plus:   { name: "Connect+",   max-band: 3g,        sims: 2, price: 120,  icon: POLISHED_BLACKSTONE_BUTTON }
  explorer:       { name: "Explorer",   max-band: 4g+,       sims: 1, price: 300,  icon: COMPASS }
  explorer-plus:  { name: "Explorer+",  max-band: 4g+,       sims: 2, price: 420,  icon: RECOVERY_COMPASS }
  pilot:          { name: "Pilot",      max-band: 5g-mmwave, sims: 1, price: 800,  icon: SPYGLASS }
  pilot-plus:     { name: "Pilot+",     max-band: 5g-mmwave, sims: 2, price: 1100, icon: ECHO_SHARD }
# Phone given free to players who have never owned one ("" = none).
starter-phone: ""
# Selling a phone back in the eShop pays this percent of its price. Carriers
# that run a trade-in program receive this much for each traded-in phone.
phone-resale-percent: 50

billing:
  # Plans are charged per their own period (set by the carrier, in real hours).
  # The first period is charged when you subscribe.
  warn-hours-before: 6        # warn this long before a charge if your balance is short
  overdue-multiplier: 4       # a missed payment becomes this many times its price
  check-interval-seconds: 60
  # New carriers get this plan to start with; the owner can edit or replace it.
  default-plan: { name: "Standard", price: 12, period-hours: 24 }
  min-period-hours: 1
  max-period-hours: 720

# Mobile data. Each plan has a data allowance (or unlimited) and decides what
# happens when it runs out: throttle to this speed, block data, or charge per GB.
data:
  throttle-mbps: 0.5

# /internet: a second chat, separate from public chat, for players with data.
internet:
  mb-per-char-send: 1.0     # the sender pays this per character
  mb-per-char-receive: 0.1  # every receiver pays this per character
  max-length: 200

# Tower manufacturers research generations and bands, design tower models
# (their own names, any subset of bands) and sell them to carriers.
manufacturing:
  max-per-player: 1
  # Share of every tower's upkeep that goes to the manufacturer that built it.
  upkeep-share-percent: 10
  # Research points gained per credit (or credit's worth of ores) spent on research.
  research-points-per-credit: 1
  # What one tower costs the manufacturer to make: base + per generation above 1
  # + each included band. Sale price = cost + the manufacturer's margin.
  cost:
    base: 20
    per-generation: 15
    bands: { 2g: 3, 3g: 5, 4g: 8, 4g+: 12, 5g-low: 12, 5g-mid: 18, 5g-high: 25, 5g-mmwave: 40 }
  # Research costs in points. Generation 1 with 2G/3G is known from the start.
  # A band can only be researched once its generation is.
  research:
    generations: { 2: 150, 3: 350, 4: 700, 5: 1400 }
    bands: { 2g: 0, 3g: 0, 4g: 80, 4g+: 160, 5g-low: 160, 5g-mid: 280, 5g-high: 420, 5g-mmwave: 700 }
  # The server-run "Generic" manufacturer: always sells full-band models of every
  # generation (named after the generations section) at cost + this margin.
  generic:
    enabled: true
    margin-percent: 40

# Small cells: short-range, high-capacity cells for busy spots and indoors. Manufacturers
# research the form factor and make small-cell models; carriers install them on wall signs
# like any tower. Phones move onto a nearby small cell automatically (stronger signal).
small-cells:
  enabled: true
  range-percent: 15           # of the band's range, with no height bonus
  wall-loss: 0.5              # walls near a small cell cost half as much signal
  capacity-multiplier: 2      # users per band at full speed, vs a macro of the same generation
  min-generation: 3           # small-cell models need Gen 3+, and carry only bands from Gen 3 up
  upkeep-base: 1              # per day, plus per generation above 1, plus the backhaul block
  upkeep-per-generation: 1
  wear-factor: 0.5            # wear per subscriber, vs a macro
  repair-time-factor: 0.5
  # Without a backhaul block a small cell links to the nearest working macro cell of its
  # carrier within this range, using this share of the macro's backhaul (shared further
  # by every small cell on the same macro). 0 = always need a block.
  wireless-backhaul-range: 200
  wireless-backhaul-multiplier: 0.8
  per-macro: 8                # small cells allowed per macro cell a carrier owns
  min-spacing: 8              # blocks between a carrier's small cells
  cost-percent: 40            # manufacturing cost vs a macro model with the same bands
  research-points: 300
  coverage-weight: 0.5        # how much they count for market coverage

# Home internet. Players start ISPs, build nodes on wall signs, and sell plans. Homes put a
# router on a wall sign, pick a provider, and then computers and phones within Wi-Fi range
# are online. Five access technologies, each with its own range, speed, ping and cost.
# See docs/isps.md and design/broadband.md.
broadband:
  enabled: true
  # Node, router and computer signs get the same layered display screen as cell towers
  # (colour stripe, status badge, chips, footer). false = plain sign text.
  fancy-screens: true
  max-isps-per-player: 1        # admins are exempt; -1 = unlimited
  max-nodes-per-isp: -1
  max-plans-per-isp: 8
  max-routers-per-player: 3
  max-computers-per-player: 6
  isp-name-pattern: "^[A-Za-z0-9_&.\\-]{2,20}$"
  node-name-pattern: "^[A-Za-z0-9_\\-]{1,12}$"
  node-min-spacing: 16          # blocks between one ISP's nodes of the same technology
  wifi-range: 24                # blocks that a Wi-Fi 4 router reaches (see wifi.tiers for the others)
  install-delay-seconds: 20     # the technician's visit between ordering and going live
  suspend-hours: 12             # a missed renewal suspends the line; it is cut after this long
  warn-hours-before: 6          # warn this long before a renewal if the wallet is short
  upkeep-period-hours: 24       # ISPs pay node and transit upkeep this often; unpaid = the whole network is down
  min-period-hours: 1
  max-period-hours: 720
  speedtest-cooldown: 30
  jitter-percent: 5
  # Phones and /internet use home Wi-Fi first: no mobile data used, and the phone's speed test
  # measures the Wi-Fi line. /internet over Wi-Fi works without a phone.
  phones-use-wifi: true
  guest-wifi-default: false     # new routers start with Wi-Fi shared with everyone
  # Node upgrades: each tier multiplies the customers a node serves at full speed.
  tier-upgrade-percent: 60      # upgrade cost = this % of the node cost, times the current tier
  tier-upkeep-step: 50          # each tier above 1 adds this % of the base upkeep
  # A plan with a data allowance drops to this speed once it is used up, until the next renewal.
  throttle-mbps: 1
  # Bundles: a deal between an ISP and a carrier. Discount percentages are capped here.
  bundle-max-discount: 30

  wifi:
    # With no tower in range, a phone on home Wi-Fi can still call and text (Wi-Fi calling).
    calling: true
    # true = a player's phone joins the best Wi-Fi in range by itself (their own router first).
    # false = they must join one with /broadband connect. Either way /broadband connect and
    # /broadband disconnect override it, and the connected network is what the HUD shows.
    auto-connect: true
    # Every solid block between the router and the device costs this many blocks of Wi-Fi range.
    wall-loss-blocks: 1.5
    # Router generations, bought from the router screen. range-factor multiplies wifi-range;
    # max-guests is how many non-owners can use a shared router at once; price is spent.
    tiers:
      "1": { name: "Wi-Fi 4", range-factor: 1.0,  max-guests: 2,  price: 0 }
      "2": { name: "Wi-Fi 5", range-factor: 1.25, max-guests: 4,  price: 80 }
      "3": { name: "Wi-Fi 6", range-factor: 1.5,  max-guests: 8,  price: 200 }
      "4": { name: "Wi-Fi 7", range-factor: 2.0,  max-guests: 16, price: 500 }

  # Transit: the backbone an ISP buys, shared by all its customers. When their plan speeds
  # (times utilization) add up to more than the ISP's capacity, every customer slows down.
  transit:
    mbps-per-tier: 5000
    max-tier: 5
    upkeep-per-tier: 30         # per upkeep period, for each tier above the first
    upgrade-cost: 400           # times the current tier
    utilization: 0.2            # share of plan speed customers use at once
    peer-bonus: 0.25            # +25% backbone for each peering ISP

  # Faults: nodes break at random (more in storms). A faulted node serves nobody.
  # The ISP can pay a technician (repair-cost per technology), or a crew fixes it after a while.
  faults:
    enabled: true
    auto-repair-hours: 6

  # 5G Home: a carrier-backed ISP (/isp create <name> carrier <carrier>) sells plans over
  # the carrier's towers. Speed comes from the signal at the home (indoor loss applied).
  fixed-wireless:
    indoor-loss-db: 8

  # Simulated households that choose ISPs by rating, load nodes and pay plans. 0 = off.
  market:
    households: 0
    step-minutes: 30
    pays: true

  # The computer's browser: news, a marketplace and mail.
  browser:
    enabled: true
    page-mb: 4                  # data a page uses (a capped plan's allowance)
    max-listings: 60
    listings-per-player: 3
    listing-days: 7
    mail-inbox: 30
    mail-length: 200
    news:
      - "Welcome to the web! Home internet is open for business."
      - "ISPs: keep your upkeep paid and your nodes repaired, or customers will leave."
      - "Tip: the Providers tab on a router shows every provider's rating and a quote for your exact spot."

  #   range         blocks from a node a home can be (0 = anywhere in the world)
  #   max-mbps      speed with perfect conditions, before the plan's own cap
  #   falloff       how distance costs speed: factor = 1 - (distance/range)^falloff * (1 - min-factor)
  #                 1 = linear (DSL), 4 = nearly flat then a cliff (fiber), 0 = no effect (satellite)
  #   min-factor    share of the speed kept at the very edge of the range
  #   needs-sky     the router needs a clear view of the sky (a dish)
  #   rain-factor / thunder-factor   speed multiplier in rain / thunderstorms
  #   node-capacity customers one node serves at full speed (times its tier). For fixed-wireless:
  #                 customers per carrier tower
  #   node-cost     paid from the ISP's balance (admins build free)
  #   node-upkeep   per upkeep period
  #   install-fee   default installation fee of a plan
  #   starter-price price of the plan a new ISP starts with, per day
  #   drop-cost-per-block   last mile: the customer pays this per block from the node to the home
  #   fault-chance-per-hour chance per hour that a node develops a fault
  #   storm-fault-factor    multiplier on that in a storm (aerial copper and coax suffer most)
  #   repair-cost   a technician fixes a fault at once, paid by the ISP
  technologies:
    dsl:
      name: "DSL"
      icon: COPPER_INGOT
      description: "Phone-line copper. Cheap and everywhere near an exchange, but speed drops fast with distance."
      range: 400
      max-mbps: 40
      upload-ratio: 0.1
      ping-ms: 30
      falloff: 1.0
      min-factor: 0.1
      node-capacity: 40
      node-cost: 150
      node-upkeep: 3
      install-fee: 10
      starter-price: 10
      max-tier: 3
      drop-cost-per-block: 0.05
      fault-chance-per-hour: 0.01
      storm-fault-factor: 4
      repair-cost: 40
    cable:
      name: "Cable"
      icon: LEAD
      description: "Coaxial cable. Fast and fairly steady, but the neighbourhood shares each node."
      range: 800
      max-mbps: 400
      upload-ratio: 0.1
      ping-ms: 15
      falloff: 2.0
      min-factor: 0.5
      node-capacity: 25
      node-cost: 450
      node-upkeep: 6
      install-fee: 25
      starter-price: 25
      max-tier: 3
      drop-cost-per-block: 0.15
      fault-chance-per-hour: 0.01
      storm-fault-factor: 3
      repair-cost: 100
    fiber:
      name: "Fiber"
      icon: END_ROD
      description: "Light down glass. Huge speeds and tiny ping that barely care about distance, but nodes are costly."
      range: 1500
      max-mbps: 10000
      upload-ratio: 1.0
      ping-ms: 4
      falloff: 4.0
      min-factor: 0.9
      node-capacity: 80
      node-cost: 1500
      node-upkeep: 12
      install-fee: 80
      starter-price: 55
      max-tier: 3
      drop-cost-per-block: 0.4
      fault-chance-per-hour: 0.002
      storm-fault-factor: 1
      repair-cost: 300
    satellite:
      name: "Satellite"
      icon: SPYGLASS
      description: "A dish and a view of the sky. Works anywhere in the world, but slow, laggy and weather-sensitive."
      range: 0
      max-mbps: 120
      upload-ratio: 0.2
      ping-ms: 550
      falloff: 0
      min-factor: 1.0
      needs-sky: true
      rain-factor: 0.5
      thunder-factor: 0.2
      node-capacity: 20
      node-cost: 900
      node-upkeep: 10
      install-fee: 60
      starter-price: 30
      max-tier: 3
      drop-cost-per-block: 0
      fault-chance-per-hour: 0.004
      storm-fault-factor: 2
      repair-cost: 200
    fixed-wireless:
      name: "5G Home"
      icon: BLAZE_ROD
      description: "Home internet over a mobile carrier's towers. No cable to dig, but it is only as good as the signal at your door."
      max-mbps: 1000              # the most a home line delivers, whatever the signal
      upload-ratio: 0.3
      ping-ms: 25
      node-capacity: 12           # customers per carrier tower at full speed
      install-fee: 20
      starter-price: 35

# Owning companies: moving money, valuations, selling and liquidating.
companies:
  # Fee on moving money between yourself and your carrier/manufacturer (either way).
  # Sending money between players is free.
  transfer-fee-percent: 5
  # Liquidating a company pays out to the owner's wallet minus this fee.
  liquidation-fee-percent: 10
  # Share of a liquidated carrier's value paid to the MVNOs it hosted, split evenly.
  mvno-farewell-percent: 20
  # A liquidated carrier's towers are worth this share of what they cost to build;
  # its unused tower stock this share of the purchase price.
  tower-scrap-percent: 30
  stock-refund-percent: 50
  # Phones still being paid off to a carrier that closed stay locked to it for good
  # ("paperweights") and sell back for this share of their price.
  paperweight-resale-percent: 5
  # Valuations include this many days of net income.
  valuation-income-days: 30
  # A carrier that can't pay its upkeep or its staff for this many days in a row is
  # declared bankrupt and closed like a liquidation (staff and MVNOs are paid first,
  # the rest goes to the owner). The owner is warned 2 days and 1 day before. 0 = off.
  bankruptcy-days: 7

# Simulated users (/cellsim) for roleplay. They're counted separately from real
# users; for tower load and congestion this many count as one real player.
simulation:
  users-per-real-user: 500
  # market = a fixed pool of simulated customers that carriers compete for (see the
  # market section); fixed = admins set each carrier's simulated users by hand.
  mode: market

# The simulated customer market (simulation.mode: market). Every hour each carrier
# gets a satisfaction score; customers leave unhappy or overpriced carriers, and
# customers without a carrier sign up with the most attractive ones.
market:
  # The fair price per day customers expect. They compare a carrier's average plan
  # price (per day) against this, blended with rivals' prices.
  reference-price-per-day: 12
  rivals-weight: 0.5          # 0 = only the fair price above, 1 = only rivals' prices
  # At this many times the going rate, customers leave en masse and nobody joins.
  refuse-price-ratio: 3
  churn:
    base: 0.01                # share leaving per day even when happy
    unhappy: 0.12             # extra per day at 0% satisfaction (scales with unhappiness squared)
    price: 0.03               # extra per day per (price ratio - 1) squared
    refused: 0.25             # per day when priced out
  shop-per-day: 0.3           # share of carrier-less customers shopping each day
  growth:
    # The pool of customers itself grows over time (new people arrive and shop around).
    # It does not depend on maintenance or staff, so it works with workforce.enabled: false.
    per-day: 0.01             # share of the pool added per day (0 = the pool never grows)
    max-size: 10000           # growth stops at this many customers (0 = no limit)
  switching:
    # Customers with a carrier also compare now and then, and move to a rival that's
    # clearly more attractive, so a better newcomer can win customers from a leader.
    per-day: 0.02             # share of each carrier's customers comparing each day
    loyalty: 0.15             # a rival must be 15% more attractive to win them
  service:
    # The service score blends reliability (towers running at full speed) with speed
    # (the top speed towers give: band x backhaul), so upgrades win customers.
    speed-weight: 0.4
    speed-reference-mbps: 300 # this top speed or more counts as full marks
  # What satisfaction is made of (relative weights).
  weights:
    quality: 0.35             # towers working at full speed (wear, upkeep, engineers)
    coverage: 0.20            # covered area compared with the best-covered carrier
    support: 0.20             # customer support staffing
    price: 0.25
  coverage-cell-size: 100     # coverage is measured on a grid of this many blocks
  # How much each band counts for coverage.
  band-weight: { 2g: 0.3, 3g: 0.5, 4g: 0.75, 4g+: 0.85, 5g-low: 0.9, 5g-mid: 1, 5g-high: 1, 5g-mmwave: 1 }

# squaremap integration (used only if squaremap is installed).
squaremap:
  enabled: true
  update-seconds: 30
  icon-size: 20
  # Coverage layers, one per carrier, toggleable in the map's layer menu.
  coverage: true
  # max = one circle per tower (its furthest band); bands = a ring for every enabled band.
  coverage-style: max
  coverage-hidden-by-default: false
  # One layer per band ("Band · 5G Mid"...) in its own colour, showing every
  # tower's reach on that band. Toggle bands individually in the layer menu.
  band-layers: true
  band-layers-hidden-by-default: true

# Roaming agreements and MVNOs (virtual carriers without towers).
partners:
  # When either side ends an agreement it keeps working this long.
  notice-hours: 24
  # A host can deprioritize roaming/MVNO users: on a busy band they get this
  # share of the speed its own customers get.
  deprioritized-speed: 0.5
  # MVNO subscribers keep service this long after their carrier misses a
  # payment to the host; then they're suspended until it pays.
  mvno-grace-hours: 24

# Carriers pay upkeep for every tower from their wallet, every period.
upkeep:
  period-hours: 24
  base-per-tower: 4
  per-generation: 4           # extra per generation above 1
  backhaul:                   # extra by backhaul block
    NETHERITE_BLOCK: 12
    DIAMOND_BLOCK: 8
    GOLD_BLOCK: 5
    IRON_BLOCK: 3
    COPPER_BLOCK: 1
  # When upkeep can't be paid the carrier's towers decay one stage every
  # step-hours. Topping up the wallet pays the upkeep and repairs them at once.
  decay:
    step-hours: 6
    # Speed at stage 1, 2, 3...; each stage from 2 on also shuts off the tower's
    # highest band. After the last listed stage the towers go silent.
    speed: [0.6, 0.4, 0.25]

# Network wear, maintenance stations and technicians. Towers wear down from the
# traffic they carry; technicians sent from your maintenance stations repair them.
# Wages, rent and repair parts are spent (they leave the economy).
workforce:
  # The master switch. false turns all of it off: no tower wear, no repair jobs, no
  # technicians, staff, stations, wages, rent or transit costs, and the Operations screens
  # are hidden. Stations and staff already built stay saved and everything is paused (not
  # backdated) until you switch it back on. Same as: /celladmin workforce on|off
  enabled: true
  wear:
    # Wear points per day (a tower goes from 0 to 100). Simulated users count fully
    # here: they pay full price, so they cost full price to serve.
    idle-per-day: 2
    per-subscriber-per-day: 0.10
    per-gb: 0.02              # real mobile data carried
    dispatch-at: 30           # a repair job is queued at this wear
    # 40+ slows the tower, 60+ also switches off its top band, 80+ two bands, 100 = silent.
    speed-at-40: 0.85
    speed-at-60: 0.6
    speed-at-80: 0.4
  technicians:
    wage: 150                 # credits per day for a regular technician
    junior-wage: 0.75         # wage multiplier by level
    senior-wage: 1.4
    junior-repair-time: 1.33  # repair time multiplier by level
    senior-repair-time: 0.74
    junior-odds: 0.45         # level mix among job seekers
    regular-odds: 0.40
    senior-odds: 0.15
    recruitment-fee-days: 3   # hiring costs this many days of wage
    severance-days: 7         # firing costs this many days of wage
    quit-after-unpaid-days: 3
    max-per-company: 60
  stations:
    # A station is a closed, roofed room with a wall sign registered by
    # /facility create station <name>. One bed = one technician.
    rent-base: 10             # per day
    rent-per-bed: 2           # per day, for every bed built
    service-radius: 2000      # technicians only go this far (same dimension)
    travel-blocks-per-minute: 150
    barrels-per-step: 4       # every 4 barrels (spare parts) make repairs 5% faster...
    barrel-step: 0.05
    barrel-max: 0.25          # ...up to 25%
    max-room-blocks: 4096
    recheck-minutes: 10       # beds are re-counted this often while loaded
  repairs:
    set-out-minutes: 5
    base-minutes: 20          # on-site time = base + minutes-per-wear x wear
    minutes-per-wear: 0.5
    parts-base: 5             # parts cost = base + per-wear x wear
    parts-per-wear: 0.2
  contractors:
    # When no technician can take a job within after-minutes, a contractor is booked
    # (unless the carrier turned contractors off).
    after-minutes: 30
    delay-hours: 6
    cost-multiplier: 3        # x (parts + a technician's labour)
    minimum: 60
  # Office staff. They cover subscribers (real plus simulated); the first few need no staff.
  self-service-subscribers: 25
  junior-productivity: 0.75   # how many subscribers juniors/seniors cover compared with regulars
  senior-productivity: 1.35
  support:
    # Call centre: one seat (stairs) and one lectern per agent.
    wage: 100
    subscribers-each: 60      # understaffed support makes customers unhappy
  engineers:
    # Network operations centre: one seat (stairs) and one observer per engineer.
    wage: 200
    subscribers-each: 100     # counts the subscribers of MVNOs you host too
    min-speed: 0.6            # understaffed engineering slows the whole network, down to this
  transit:
    # Data carried costs the network transit, paid on payday with wages and rent.
    cr-per-gb: 1
    simulated-gb-per-day: 1   # per simulated customer (only while simulated revenue is on)
  # Show a technician figure at the tower during a repair.
  visible-technicians: true
  # /celladmin timewarp step size.
  timewarp-step-minutes: 10

messaging:
  sms-expire-minutes: 10
  call-ring-seconds: 30
  # Calls get choppy at or below this many bars.
  garble-at-or-below-bars: 1
  garble-chance: 0.15

phone:
  # /cell opens the phone. Numbers look like 312-4821: the first 3 digits are
  # the carrier's prefix, assigned automatically when the carrier is created.
  inbox-max: 45        # texts kept per player (max 45, one page)
  contacts-max: 45     # contacts per player (max 45, one page)
  prompt-timeout-seconds: 60  # how long the phone waits for you to type a number/message in chat

hud:
  # Players toggle it with /cell hud.
  default-enabled: true
  # sidebar = scoreboard panel on the right, actionbar = one line above the hotbar
  style: sidebar
  # Sidebar title (MiniMessage: colours and gradients allowed).
  title: "<gradient:#5EE7DF:#B490CA><b>MCcomm</b></gradient>"

# The screen covers the sign's front face exactly: a thin block panel the size
# of the sign board, with text auto-scaled to fit inside it.
display:
  panel-material: BLACK_CONCRETE
  # Full-bright so the screen is readable at night.
  full-bright: true
  # If text shows mirrored/backwards on your client, set this to 180.
  yaw-offset: 0
  # Towers use wall signs only. Board size and position in blocks (vanilla
  # geometry), relative to the sign block's centre. face-offset is how far the
  # front face sits from the block centre along the sign's facing (negative =
  # towards the wall). Only change these if a resource pack changes sign models.
  wall-sign: { width: 1.0, height: 0.5, center-y: 0.5208, face-offset: -0.3958 }
