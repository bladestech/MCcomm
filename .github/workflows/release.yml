name: Release

# When a GitHub release is published, build the jar with the release's version
# (tag v1.2.3-alpha -> CellTowers-1.2.3-alpha.jar) and attach it to the release.
# Can also be run by hand for an existing tag to rebuild and replace its jar.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach to (e.g. v1.0.0-alpha)"
        required: true

permissions:
  contents: write

jobs:
  release-jar:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          VERSION="${TAG#v}"
          echo "Building version $VERSION"
          ./gradlew build --no-daemon -PreleaseVersion="$VERSION"
          ls -l build/libs

      - name: Attach jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" build/libs/CellTowers-*.jar --clobber --repo "$GITHUB_REPOSITORY"
